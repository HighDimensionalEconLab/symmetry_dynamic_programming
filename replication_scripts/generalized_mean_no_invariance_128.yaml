program: generalized_mean.py
project: generalized_mean_examples
name: gen_mean_no_invariance_128
description: Generalized mean with no invariance functional form  for N = 128 and 100 seeds
method: grid
parameters:
  trainer.logger.tags:
    value: [gen_mean_no_invariance_128]
  seed:
    min: 1
    max: 100 # number of ensembles to solve
  trainer.max_epochs:
    value: 1000
  trainer.min_epochs:
    value: 0
  trainer.logger.offline:
    value: false # log online for W&B optimization
  trainer.max_time:
    value: 00:00:5:00
  model.N:
    value: 128 # the dimensionality
  model.p:
    value: 1.5 # the generalized mean power
  model.a_max:
    value: 2.0
  model.num_train_points:
    value: 10
  model.num_val_points:
    value: 50
  model.num_test_points:
    value: 200
  trainer.callbacks.stopping_threshold: #stop if train_loss< callbacks.stopping_threshold
    value: 1e-6
  trainer.callbacks.monitor:
    value: train_loss
  trainer.callbacks.divergence_threshold:
    value: 1e6
  optimizer.lr:
    value: 0.001
  model.ml_model.class_path:
    value: econ_layers.layers.FlexibleSequential
  model.ml_model.n_in:
    value: 128 # must match the "N" parameter in this case
  model.ml_model.n_out:
    value: 1
  model.ml_model.layers:
    value: 4
  model.ml_model.hidden_dim:
    value:  128
