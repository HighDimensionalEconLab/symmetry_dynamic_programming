program: investment_euler.py
name: deep_sets_nonlinear_overfit
description: deep sets over parameterization with different numbers of datapoints
method: grid

parameters:
  trainer.logger.tags:
    value: [deep_sets_nonlinear_overfit]
  seed:
    min: 1
    max: 100 # number of ensembles to solve
  
  trainer.logger.offline:
    value: false # log online for W&B optimization
  trainer.max_time:
    value: 00:00:05:00
  trainer.max_epochs:
    value: 500
   # Stopping criteria
  trainer.callbacks:
     value: [] # turning off early stopping in particular
  # Provide distributions and variations for optimizer
  model.test_loss_success_threshold:
    value: 1.0e-4 # just for posting of the return code
  model.N:
    value: 128
  optimizer.lr:
    value: 0.003
  lr_scheduler.step_size:
    value: 50
  lr_scheduler.gamma:
    value: 0.8
  model.train_subsample_trajectories:
    values: [4, 5, 10]
  model.train_trajectories:
    value: 1  
  model.val_trajectories:
    value: 0 # not using validation for stopping criteria
  model.batch_size:
    value: 2
  model.nu:
    value: 1.5