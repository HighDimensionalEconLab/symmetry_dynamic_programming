program: investment_euler.py
name: deep_sets_nonlinear_nu_130_one_run
description: Multiple seeds given baseline deep sets parameterization
method: grid
parameters:
  trainer.logger.tags:
    value: [deep_sets_nonlinear_nu_130_one_run]
  seed:
    value: 123 
    
  trainer.logger.offline:
    value: false # log online for W&B optimization
  trainer.max_time:
    value: 00:00:03:00  # these tests shouldn't take more than 2-3 minutes

  # Stopping criteria
  trainer.callbacks.monitor:
    value: val_loss
  trainer.callbacks.stopping_threshold:
    value: 1.0e-6
  #Learning rate

  model.reset_trajectories_frequency:
    value: 10 # otherwise sticks with linear until the test set
  optimizer.lr:
    value: 1.0e-3
  lr_scheduler.step_size:
    value: 40
  lr_scheduler.gamma:
    value: 0.8

  # Core parameters which may be different from baseline investment_euler_defaults.yaml
  model.N:
    value: 128
  model.nu:
    value: 1.3
  model.ml_model.phi_layers:
      value: 1
  model.train_trajectories:
    value: 32
  model.val_trajectories:
    value: 16    
  model.test_seed:
    value: 10

