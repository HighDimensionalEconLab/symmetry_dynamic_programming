program: investment_euler.py
description: Multiple seeds deep sets with 4 layers for phi and 8 for rho
method: grid
parameters:
  trainer.logger.tags:
    value: [deep_4_8_deep_sets]
  seed:
    min: 1
    max: 100 # number of ensembles to solve
  trainer.logger.offline:
    value: false # log online for W&B optimization
  trainer.max_time:
    value: 00:00:10:00

  # Stopping criteria
  trainer.callbacks.monitor:
    value: val_loss
  trainer.callbacks.stopping_threshold:
    value: 1.0e-6
  #Learning rate
  #optimizer.lr:
    #value: 1.0e-4

  # Core parameters which may be different from baseline investment_euler_defaults.yaml
  model.N:
    value: 128


  # Variation on parameters for experiment
  model.ml_model.phi_layers:
      value: 4
  model.ml_model.rho_layers:
      value: 8