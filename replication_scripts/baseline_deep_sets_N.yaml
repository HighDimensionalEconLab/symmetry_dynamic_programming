program: investment_euler.py
name: baseline_deep_sets_N
description: Multiple seeds for different N with the baseline deep sets parameterization
method: grid
parameters:
  trainer.logger.tags:
    value: [baseline_deep_sets_N]
  seed:
    min: 1
    max: 100 # number of ensembles to solve
  trainer.logger.offline:
    value: false # log online for W&B optimization
  trainer.max_time:
    value: 00:00:05:00  # Extended the time a little longer because for large enough N it starts scaling linearly due to linear algebra operations

  # Stopping criteria
  trainer.callbacks.monitor:
    value: val_loss
  trainer.callbacks.stopping_threshold:
    value: 1.0e-6

  # Core parameters which may be different from baseline investment_euler_defaults.yaml
  model.N:
    values: [8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192] # any higher and GPUs are likely required for linear time-scaling
