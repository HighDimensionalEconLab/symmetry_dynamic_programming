program: generalized_mean.py
project: generalized_mean_examples
name: generalized_mean_no_invariance_N_NNN
description: Generalized mean without using invariances and with multiple seeds
method: grid
parameters: 
  trainer.logger.tags:
    value: [generalized_mean_no_invariance_N_NNN]
  seed:
    min: 123
    max: 133 # 123 + 100 # number of seeds
  trainer.max_epochs:
    value: 5000
  trainer.min_epochs:
    value: 0
  trainer.logger.offline:
    value: false # log online for W&B optimization
  trainer.max_time:
    value: 00:00:03:00
  model.num_train_points:
    value: 10
  model.num_val_points:
    value: 10
  model.num_test_points:
    value: 200
  trainer.callbacks.stopping_threshold: #stop if train_loss< callbacks.stopping_threshold
    value: 1e-5 # TODO: make smaller for full table
  model.test_loss_success_threshold:
    value: 1e-3 # Very rough, mostly to have a flag if things blow up.
  trainer.callbacks.monitor:
    value: train_loss
  optimizer.lr:
    value: 0.005
  model.N:
    value: NNN
  model.ml_model.class_path:
    value: econ_layers.layers.FlexibleSequential
  model.ml_model.n_in:
    value: NNN
  model.ml_model.n_out:
    value: 1
  model.ml_model.layers:
    value: 4
  model.ml_model.hidden_dim:
    value:  128
