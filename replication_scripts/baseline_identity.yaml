program: investment_euler.py
method: grid
parameters:
  trainer.logger.tags:
    value: [baseline_identity]
  seed:
    min: 1
    max: 10 # number of ensembles to solve
  trainer.logger.offline:
    value: false # log online for W&B optimization
  trainer.max_time:
    value: 00:00:03:00  # these tests shouldn't take more than 2-3 minutes
  
   # Stopping criteria
  trainer.callbacks.monitor:
    value: val_loss
  trainer.callbacks.stopping_threshold:
    value: 1.0e-6
  
  # Core parameters which may be different from baseline investment_euler_defaults.yaml
  model.N:
    value: 128    
  model.ml_model.class_path:
    value: econ_layers.layers.DeepSetMoments
  model.ml_model.init_args.L:
    value: 1  # i.e., only the first moment    
  model.ml_model.init_args.n_in:
    value: 1
  model.ml_model.init_args.n_out:
    value: 1
  model.ml_model.init_args.rho_layers:
    value: 4
  model.ml_model.init_args.rho_hidden_dim:
    value: 128
  model.ml_model.init_args.rho_hidden_bias:
    value: true
  model.ml_model.init_args.rho_last_bias:
    value: true
  model.ml_model.init_args.rho_activator.class_path:
    value: torch.nn.ReLU