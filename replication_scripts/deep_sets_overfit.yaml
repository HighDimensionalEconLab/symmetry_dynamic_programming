program: investment_euler.py
name: deep_sets_overfit
description: deep sets over parameterization with different numbers of datapoints
method: grid

parameters:
  trainer.logger.tags:
    value: [deep_sets_overfit]
  seed:
    min: 1
    max: 100 # number of ensembles to solve
  
  trainer.logger.offline:
    value: false # log online for W&B optimization
  trainer.max_time:
    value: 00:00:05:00
  trainer.max_epochs:
    value: 400
  model.hpo_objective_name:
    value: val_loss
   # Stopping criteria
  trainer.callbacks.monitor:
    value: val_loss
  trainer.callbacks.stopping_threshold:
    value: 1.0e-5    
  # Provide distributions and variations for optimizer
  model.N:
    value: 128
  optimizer.lr:
    value: 0.003
  lr_scheduler.step_size:
    value: 50
  lr_scheduler.gamma:
    value: 0.8
  model.train_subsample_trajectories:
    values: [3, 4, 5, 7, 10]
  model.train_trajectories:
    value: 1  
  model.batch_size:
    value: 2 