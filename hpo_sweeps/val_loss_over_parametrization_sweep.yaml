program: investment_euler.py
name: val_loss_over_parametrization_sweep
description: HPO for val_loss to early stopping criteria on val_loss of the baseline_linear_deep_sets
method: bayes
metric:
  # See the investment_euler.py log_and_save
  name: hpo_objective 
  goal: minimize
  # early_terminate:  not necessary here given the trainer.max_time

trainer:
  max_epochs: 
    value: 400
parameters:
  # Fix parameters here:
  trainer.logger.offline:
    value: false # log online for W&B optimization
  trainer.max_time:
    value: 00:00:03:00  # these tests shouldn't take more than 2-3 minutes
  model.hpo_objective_name:
    value: val_loss
   # Stopping criteria
  trainer.callbacks.monitor:
    value: val_loss
  trainer.callbacks.stopping_threshold:
    value: 1.0e-6

  # Provide distributions and variations for optimizer
  model.N:
    values: [128,512]
  optimizer.lr:
    min: 5.0e-5
    max: 5.0e-3
  lr_scheduler.step_size:
    values: [5, 10, 50]
  lr_scheduler.gamma:
    values: [0.9, 0.8, 0.5]
  model.train_subsample_trajectories:
    value: 6
  model.train_trajectories:
    value: 1  
  model.batch_size:
    value: 2
  model.ml_model.rho_layers:
    values: [2,4]
  model.ml_model.phi_layers:
    values: [1,2]
  model.ml_model.rho_hidden_dim:
    values: [128,256]      
  model.ml_model.phi_hidden_bias:
    values: [True, False]