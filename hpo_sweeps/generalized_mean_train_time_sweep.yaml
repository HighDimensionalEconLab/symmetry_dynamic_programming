program: generalized_mean.py
project: generalized_mean_examples
description: HPO for train_time to early stopping criteria on val_rel_error
method: bayes
metric:
  # See the investment_euler.py log_and_save
  name: hpo_objective
  goal: minimize
  # early_terminate:  not necessary here given the trainer.max_time
parameters:
  # Fix parameters here:
  trainer.max_epochs:
    value: 2000
  trainer.min_epochs:
    value: 0
  trainer.logger.offline:
    value: false # log online for W&B optimization
  trainer.max_time:
    value: 00:00:05:00  # these tests shouldn't take more than 2-3 minutes
  model.hpo_objective_name:
    value: val_rel_error # sets the objective.  Only logs if monitor < stopping threshold
  model.N:
    value: 128 # the dimensionality
  model.p:
    value: 1.5 # the generalized mean power
  model.a_max:
    value: 2.0
  model.num_train_points:
    value: 10
  model.num_val_points:
    value: 50
  model.num_test_points:
    value: 200
  trainer.callbacks.stopping_threshold:
    value: 1e-6

  # Provide distributions and variations for optimizer
  optimizer.lr:
    #value: 0.005
    #values: [0.001, 0.0001, 0.0001]
    distribution: uniform
    min: 0.0001
    max: 0.01

  model.ml_model.L:
    values: [1,2,3]
  model.ml_model.phi_layers:
    values: [1,2] 
  model.ml_model.phi_hidden_dim:
    values: [128, 256]
  model.ml_model.rho_layers:
    values: [1,2,3]
  model.ml_model.rho_hidden_dim:
    value: 128